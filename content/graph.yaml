  - {from: M01, to: M08, type: horizontal, note: "Orders of magnitude meet the size of sample spaces"}
  - {from: M06, to: M07, type: horizontal, note: "E to the i theta joins growth and rotation"}
  - {from: M11, to: M26, type: horizontal, note: "Pivoting is a stability choice, not only an algebra step"}
  - {from: M12, to: M22, type: horizontal, note: "Variance is a squared length; covariance an inner product"}
  - {from: M12, to: M25, type: horizontal, note: "Least squares is maximum likelihood under Gaussian noise"}
  - {from: M13, to: M18, type: horizontal, note: "Hessian eigenvalues decide minimum, maximum or saddle"}
  - {from: M14, to: M23, type: horizontal, note: "PCA is the eigen-decomposition of the covariance matrix"}
  - {from: M15, to: M24, type: horizontal, note: "Limits make the law of large numbers precise"}
  - {from: M17, to: M24, type: horizontal, note: "Monte Carlo is integration by sampling"}
  - {from: M19, to: M26, type: horizontal, note: "Finite differences fail at tiny steps; autodiff does not"}
  - {from: M19, to: M27, type: horizontal, note: "The cross-entropy gradient through softmax is p minus y"}
  - {from: M21, to: M27, type: horizontal, note: "Surprise of an event is minus the log of its probability"}
  - {from: M24, to: M26, type: horizontal, note: "Summing a million samples needs compensated summation"}
  - {from: M25, to: M27, type: horizontal, note: "Maximizing likelihood is minimizing cross-entropy"}
  - {from: M25, to: M28, type: horizontal, note: "Negative log-likelihoods of exponential families are convex"}
  - {from: M29, to: M32, type: horizontal, note: "Constant-step SGD is a Markov chain with a stationary distribution"}
  - {from: M33, to: M34, type: horizontal, note: "Randomized SVD works because random projections preserve geometry"}
