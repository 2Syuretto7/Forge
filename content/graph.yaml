  - {id: L14, title: "Tokenization and language modeling: a GPT from scratch", track: arch, stage: models_gpus, gpu: true, compute: colab}
  - {id: L15, title: "Scaling laws and compute-optimal training", track: llm, stage: scale, gpu: true, compute: colab}
  - {id: L16, title: "Data at scale: curation, dedup, mixtures, pipelines", track: sys, stage: scale, gpu: true, compute: browser+colab}
  - {id: L17, title: "Mixed precision and floating-point numerics", track: sys, stage: models_gpus, gpu: true, compute: colab}
  - {id: L18, title: "Distributed training: DDP, FSDP/ZeRO, tensor and pipeline parallel", track: sys, stage: scale, gpu: true, compute: colab}
  - {id: L19, title: "A real pretraining run: loss spikes, checkpoints, eval harness", track: sys, stage: scale, gpu: true, compute: colab}
  - {id: L20, title: "Fine-tuning: SFT, LoRA, distillation", track: llm, stage: frontier, gpu: true, compute: colab}
  - {id: L21, title: "RL for language models: policy gradients, RLHF, DPO, verifiable rewards", track: llm, stage: frontier, gpu: true, compute: colab}
  - {id: L22, title: "Inference systems: KV cache, batching, quantization, speculative decoding", track: sys, stage: frontier, gpu: true, compute: colab}
  - {id: L23, title: "Evaluation and interpretability: probes, sparse autoencoders, circuits", track: llm, stage: frontier, gpu: true, compute: colab}
  - {id: L24, title: "Capstone: train, align, evaluate and serve a small LM", track: all, stage: frontier, gpu: true, compute: colab}
