  - {id: L10, title: "Normalization, residuals and training stability", track: arch, stage: models_gpus, gpu: false, compute: browser}
  - {id: L11, title: "GPU architecture and the roofline model", track: sys, stage: models_gpus, gpu: true, compute: colab}
