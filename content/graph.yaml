  - {id: L06, title: "Generalization, bias-variance and double descent", track: core, stage: learning, gpu: false, compute: browser}
  - {id: L07, title: "Neural networks and backprop from scratch", track: core, stage: learning, gpu: false, compute: browser}
  - {id: L08, title: "Build a mini autograd engine; PyTorch internals", track: sys, stage: learning, gpu: true, compute: browser+colab}
