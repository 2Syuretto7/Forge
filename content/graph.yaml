# Single source of truth for the curriculum graph (EXECUTION_PLAN.md Section 10).
tracks: [math, core, arch, sys, llm]
stages: [foundations, learning, models_gpus, scale, frontier]
lessons:
  - {id: L01, title: "Linear algebra as the geometry of data", track: math, stage: foundations, gpu: false, compute: browser}
  - {id: L02, title: "Probability, likelihood and estimation", track: math, stage: foundations, gpu: false, compute: browser}
  - {id: L03, title: "Calculus, Jacobians and automatic differentiation", track: math, stage: foundations, gpu: false, compute: browser}
  - {id: L04, title: "Information theory: entropy, cross-entropy, KL", track: math, stage: foundations, gpu: false, compute: browser}
