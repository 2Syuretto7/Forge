annotations:
  - {target: L04, movement: m2-derivation, anchor: "Units: nats, bits and perplexity", text: "A language model's training loss is this cross-entropy per token; L14 converts it to bits per character to compare tokenizers."}
  - {target: L13, movement: m2-derivation, anchor: "The decoder block", text: "L14 trains this block on BPE tokens, with the output layer tied to the token embedding."}
concepts:
  - q: "How does byte-pair encoding build its vocabulary?"
    a: "Starting from the 256 byte values, it repeatedly replaces the most frequent adjacent pair of tokens in the training text with a new token, recording each merge; encoding replays the merges in order."
  - q: "Why compare language models in bits per character rather than loss per token?"
    a: "Different tokenizers cut the same text into different numbers of tokens, so per-token losses are not comparable; dividing the total loss by the number of characters, and by ln 2, is."
  - q: "What do temperature, top-k and top-p do when sampling?"
    a: "Temperature divides the logits, sharpening the distribution below 1 and flattening it above; top-k keeps only the k most likely tokens; top-p keeps the smallest set whose probabilities add up to p."
  - q: "What is weight tying in a language model?"
    a: "Using the token embedding matrix, transposed, as the output layer, so one matrix both embeds inputs and scores outputs; its gradient is the sum of both uses."
  - q: "Why does byte-level BPE never fail to encode a string?"
    a: "Every string is a sequence of UTF-8 bytes and every byte is in the base vocabulary, so unknown characters fall back to their bytes."
  - q: "What is perplexity?"
    a: "The exponential of the mean cross-entropy in nats; a model with perplexity k is as uncertain as a uniform choice among k tokens."
katas: [e01, e03, e08]
