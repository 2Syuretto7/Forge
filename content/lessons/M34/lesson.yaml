id: M34
hours: 12
capstone: "JL compression of an embedding set preserving pairwise distances within 10 percent, plus a measured check of the 1/sqrt(d) and init-scale derivations"
teaser: "Concentration of norms, near-orthogonality of random directions, the Johnson-Lindenstrauss lemma with proof, the 1/sqrt(d) in attention, variance-preserving initialization, and the Marchenko-Pastur spectrum of random matrices with the signals that escape it."
