id: M33
hours: 12
capstone: "Randomized SVD meeting a stated relative error at under one-fifth the time of full SVD, with a roofline placement of each kernel"
teaser: "Flops, bytes and arithmetic intensity; blocked algorithms and the roofline; conjugate gradient, Krylov subspaces and preconditioning; randomized range finders, randomized SVD and sketching; and why forming the normal equations loses half your digits."
movements:
  - {file: m0-recall.md,     mode: theory,   minutes: 25}
