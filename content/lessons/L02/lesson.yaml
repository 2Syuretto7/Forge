id: L02
hours: 7
capstone: "Reproduce a double-descent curve with random features and explain where the peak sits"
teaser: "Why test error falls, rises and falls again as models grow, and how not to fool yourself measuring it."
movements:
  - {file: m0-recall.md,     mode: theory,   minutes: 20}
  - {file: m1-puzzle.md,     mode: theory,   minutes: 35}
  - {file: m2-derivation.md, mode: theory,   minutes: 130}
