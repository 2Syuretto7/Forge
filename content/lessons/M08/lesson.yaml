annotations:
  - {target: M03, anchor: "independently picks one of 2 outputs", text: "M08: this is the product rule of counting; the same rule counts every arrangement and selection."}
  - {target: M05, anchor: "two nested loops over", text: "M08: those pairs are the binomial coefficient n choose 2, and Pascal's rule counts them for any size of group."}
concepts:
  - q: "Why does a shared birthday become likely with only 23 people?"
    a: "What matters is the number of pairs, not of people: 23 people form 253 pairs, and each pair matches with probability 1/365. The chance that no pair matches is the product of (365 - i)/365 for i up to 22, about 0.493, so a match has probability about 0.507. Pairs grow like the square of the number of people."
