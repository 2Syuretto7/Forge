concepts:
  - q: "How many bytes per parameter does mixed-precision Adam training need for model states?"
    a: "About 16: 2 for 16-bit weights, 2 for 16-bit gradients, and 12 for fp32 master weights, momentum and variance."
  - q: "What does each GPU send in a ring all-reduce of n bytes over P GPUs?"
    a: "2 (P - 1) / P times n bytes: a reduce-scatter and an all-gather, each moving (P - 1) / P of the data, almost independent of P."
  - q: "What do ZeRO stages 1, 2 and 3 shard?"
    a: "Stage 1 the optimizer states, stage 2 also the gradients, stage 3 also the weights, each over the data-parallel ranks."
  - q: "How does Megatron-style tensor parallelism split an MLP?"
    a: "The first layer by columns and the second by rows, so each GPU computes a slice of the hidden units and a partial output, and one all-reduce sums the outputs."
  - q: "What is the pipeline bubble?"
    a: "The idle fraction (p - 1) / (m + p - 1) of a pipeline with p stages and m micro-batches, while the pipeline fills and drains."
  - q: "What does activation checkpointing trade?"
    a: "Memory for compute: it keeps only some activations and recomputes the rest during backward, at the cost of about one extra forward pass."
katas: [e02, e05, e08]
