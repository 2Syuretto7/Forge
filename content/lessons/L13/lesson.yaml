id: L13
hours: 11
capstone: "Train a two-layer transformer on character-level Shakespeare (public domain) to a validation loss below 1.70 nats per character"
teaser: "Derive attention as a soft lookup, build multi-head attention and its backward pass by hand, then train a small transformer on Shakespeare."
