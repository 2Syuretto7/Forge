  - {target: L09, movement: m2-derivation, anchor: "Why divide by the square root of the dimension", text: "In fp16 the scale matters for range too: scores above about 11 overflow the exponential, and large unscaled dot products overflow outright (L13)."}
concepts:
  - q: "How do bf16 and fp16 differ?"
    a: "Both use 16 bits; bf16 keeps fp32's 8 exponent bits (same range, about 3 significant digits) while fp16 has 5 exponent bits and 10 mantissa bits (more precision, but a maximum of 65504 and early underflow)."
  - q: "Why does mixed-precision training keep fp32 master weights?"
    a: "Updates are often smaller than the spacing between half-precision numbers near the weight's value, so applied directly to fp16 weights they round away; an fp32 copy accumulates them."
  - q: "What does loss scaling do?"
    a: "It multiplies the loss by a large factor before the backward pass so small gradients do not underflow in fp16, then divides the gradients by the same factor before the update; dynamic scaling lowers the factor when gradients overflow."
  - q: "Why is a long sum accumulated in fp32 even when its inputs are fp16?"
    a: "Once the running sum is large, its spacing exceeds the small addends, which then round away; tensor cores and well-written kernels accumulate in fp32."
  - q: "What is stochastic rounding and why is it useful?"
    a: "Rounding up or down at random with probabilities that make the expected result exact; tiny updates then accumulate on average instead of always rounding away."
  - q: "How many bytes per parameter does mixed-precision training with Adam need, without activations?"
    a: "About 16: fp16 weights and gradients (2 + 2) plus fp32 master weights and two Adam moments (4 + 4 + 4)."
katas: [e01, e04, e06]
