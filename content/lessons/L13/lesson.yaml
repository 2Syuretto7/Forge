  - {file: m0-recall.md,     mode: theory,   minutes: 30}
  - {file: m1-puzzle.md,     mode: theory,   minutes: 45}
  - {file: m2-derivation.md, mode: theory,   minutes: 200}
  - {file: m3-build.md,      mode: practice, minutes: 170}
  - {file: m4-scale.md,      mode: practice, minutes: 60}
  - {file: m5-break.md,      mode: both,     minutes: 50}
