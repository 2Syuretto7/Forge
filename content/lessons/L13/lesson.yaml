  - {file: m7-capstone.md,   mode: practice, minutes: 75}
hooks:
  - {to: L12, text: "The softmax over the score matrix becomes one fused kernel: FlashAttention."}
  - {to: L14, text: "Add a tokenizer, a data pipeline and sampling, and this model becomes a GPT."}
  - {to: L20, text: "Fine-tuning methods such as LoRA adapt exactly these projection matrices."}
  - {to: L22, text: "At inference the keys and values of past tokens are cached instead of recomputed."}
