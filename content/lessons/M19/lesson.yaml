hooks:
  - {to: L07, text: "Backpropagation is reverse-mode differentiation applied to a network's layers."}
  - {to: L08, text: "You will turn these vector-Jacobian products into a working autograd engine for tensors."}
  - {to: M26, text: "Finite differences fail at tiny steps; automatic differentiation has no step and no truncation error."}
  - {to: M27, text: "The gradient of cross-entropy through a softmax is simply p minus y."}
reuses:
  - {from: M18, concept: "Jacobians and the chain rule as their product"}
annotations:
  - {target: M18, anchor: "the order in which they are multiplied decides the cost", text: "M19: multiplying from the loss end backwards keeps every intermediate result a row vector, a vector-Jacobian product; that is reverse mode, and it costs a few evaluations of f whatever the number of inputs."}
concepts:
  - q: "Why does reverse mode compute a full gradient of a scalar function for about the cost of one evaluation, while forward mode needs one pass per input?"
    a: "The gradient is a product of Jacobians, u^T J_K ... J_1 with u = 1 for a scalar output. Starting from the output, every partial product is a single row vector, so each step is a cheap vector-Jacobian product and one backward sweep gives all n partial derivatives. Forward mode multiplies from the input side with one direction at a time, giving one column (one partial derivative) per pass."
katas: [e05]
