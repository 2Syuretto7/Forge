id: M19
hours: 12
capstone: "Dual-number and reverse-mode library that differentiates a 20-line function, verified against finite differences"
teaser: "Derivatives of matrix expressions, Jacobian-vector and vector-Jacobian products, computational graphs, forward mode with dual numbers, reverse mode, the matmul and softmax VJPs, and why reverse mode wins for a scalar loss."
movements:
  - {file: m0-recall.md,     mode: theory,   minutes: 25}
  - {file: m1-puzzle.md,     mode: theory,   minutes: 40}
