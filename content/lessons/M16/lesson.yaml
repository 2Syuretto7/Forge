id: M16
hours: 12
capstone: "1D optimizer suite with measured convergence orders (linear, superlinear, quadratic) matching theory within 10 percent"
teaser: "The mean value theorem, Taylor polynomials with remainder, the second-derivative test, convexity, Newton's method and its quadratic convergence, and gradient descent's step-size limit 2/L."
