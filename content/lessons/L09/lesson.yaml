id: L09
hours: 9
capstone: "An optimizer bake-off on the L07 digit task, tuned on a validation split, with a recipe that reaches at least 92 percent test accuracy"
teaser: "Derive why gradient descent crawls in narrow valleys, then build momentum, Adam, AdamW, schedules and initialization from scratch and race them."
