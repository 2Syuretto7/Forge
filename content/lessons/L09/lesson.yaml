annotations:
  - {target: L07, movement: m2-derivation, anchor: "Training: minibatch stochastic gradient descent", text: "L09 replaces this fixed step with momentum, Adam and schedules, and shows that the largest curvature limits the step size."}
  - {target: L05, movement: m2-derivation, anchor: "Optimization in practice", text: "Standardizing lowers the condition number of the Hessian, which L09 shows sets the convergence rate of gradient descent."}
concepts:
  - q: "What is the largest stable learning rate for gradient descent on a quadratic with Hessian eigenvalues between mu and L?"
    a: "2/L. Each eigen-direction is multiplied by (1 - eta lambda) per step, which must stay inside (-1, 1) for the largest eigenvalue."
  - q: "How many steps does gradient descent need on a quadratic with condition number kappa, compared with heavy-ball momentum?"
    a: "About kappa/2 times ln(1/epsilon) for gradient descent, about sqrt(kappa)/2 times ln(1/epsilon) for optimally tuned momentum."
  - q: "Why does Adam need bias correction?"
    a: "Its moving averages start at zero, so early on they underestimate the gradient moments by factors 1 - beta^t; with beta2 close to 1 the second moment is underestimated far more, so uncorrected early steps are several times too large."
  - q: "What is the difference between L2 regularization and decoupled weight decay in Adam?"
    a: "L2 adds lambda theta to the gradient, which Adam then divides by sqrt(v), so weights with large gradients decay less; AdamW shrinks the weights directly by eta lambda theta, at the same rate for every weight."
  - q: "Where does He initialization come from?"
    a: "Keeping the second moment of activations constant through a ReLU layer: Var(z) = n_in s^2 E[x^2] and ReLU halves the second moment, so s^2 = 2/n_in."
  - q: "Why warm up the learning rate?"
    a: "Early in training the curvature is high and Adam's second-moment estimates are based on few gradients, so large steps are unstable; ramping the rate up over the first steps avoids early divergence."
katas: [e02, e05, e06]
