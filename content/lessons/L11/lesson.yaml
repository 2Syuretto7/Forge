annotations:
  - {target: L02, movement: m2-derivation, anchor: "4. More parameters than data", text: "L11 measures how test loss falls when parameters and data grow together, and how to split a budget between them."}
  - {target: L05, movement: m2-derivation, anchor: "5. Schedules", text: "L11 shows that matching the schedule to each run's length changes a fitted scaling law, and that the best rate shrinks as models grow."}
  - {target: L10, movement: m2-derivation, anchor: "1. Language modeling is cross-entropy minimization", text: "L11 fits this validation loss against parameters, tokens and compute."}
concepts:
  - q: "Why does training a transformer cost about 6ND FLOPs?"
    a: "Each parameter does one multiply-add per token in the forward pass (2 FLOPs) and two products of the same size in the backward pass (4 FLOPs), for N parameters and D tokens."
  - q: "How should parameters and tokens grow with the compute budget according to Hoffmann et al.?"
    a: "About equally: both roughly as the square root of compute, around 20 tokens per parameter."
  - q: "What is the parametric loss law fitted by Hoffmann et al.?"
    a: "L(N, D) = E + A / N^alpha + B / D^beta: an irreducible loss plus power-law terms for a finite model and finite data."
  - q: "Why does a pure power law fitted on a narrow range extrapolate optimistically?"
    a: "The loss approaches an irreducible floor and bends in log-log coordinates; a straight line keeps falling at the same slope and predicts too low a loss."
  - q: "Why train a smaller model on more tokens than is compute-optimal?"
    a: "Serving costs about 2N FLOPs per token, so a model that will serve many tokens is cheaper overall if it is smaller, even though reaching the same loss costs more training."
  - q: "How do you check a scaling-law fit?"
    a: "Hold out the largest run, predict its loss from a fit to the others before training it, compare, and bootstrap the runs for uncertainty."
katas: [e03, e06, e07]
