id: L11
hours: 9
capstone: "A sweep of small GPTs across model sizes and token counts, a fitted scaling law, and the loss of a larger held-out run predicted before training it"
teaser: "Count compute, fit scaling laws the way Hoffmann et al. did, derive how to split a budget between parameters and tokens, and predict a run before you train it."
