concepts:
  - q: "How does the online softmax compute a softmax in one pass over blocks?"
    a: "It keeps a running maximum m and a running sum l of exp(x - m); when a new block raises the maximum, the old sum is multiplied by exp(m_old - m_new) before the block's terms are added."
  - q: "Why does FlashAttention use less memory than standard attention?"
    a: "It never stores the N by N score or probability matrix: it streams keys and values through on-chip memory with an online softmax, and keeps only one log-sum-exp per query for the backward pass."
  - q: "What is memory coalescing?"
    a: "When the 32 threads of a warp access consecutive addresses, the hardware serves them with a few wide transactions; scattered or strided accesses need many transactions and waste bandwidth."
  - q: "Why are softmax and normalization kernels computed in fp32 even for fp16 tensors?"
    a: "exp overflows fp16 above about 11, and sums of many fp16 values lose precision, so kernels load fp16, compute and accumulate in fp32, and store fp16."
  - q: "Why does a Triton kernel need masks on its loads and stores?"
    a: "Blocks have power-of-two sizes that rarely divide the data exactly; without a mask the last block reads and writes past the end of the tensor."
  - q: "What does kernel fusion save in a row softmax?"
    a: "The unfused version writes the exponentials to memory and reads them back several times; the fused kernel reads each row once and writes the result once, about a third of the traffic."
katas: [e01, e03, e04]
