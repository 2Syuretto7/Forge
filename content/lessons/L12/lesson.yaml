concepts:
  - q: "Why does MinHash estimate Jaccard similarity?"
    a: "For a random hash, the minimum over the union of two sets is equally likely to be any element, and the two minima agree exactly when it lies in the intersection, which has probability |A and B| / |A or B|."
  - q: "What does banding a MinHash signature achieve?"
    a: "Two documents become candidates if any band of r rows matches, with probability 1 - (1 - s^r)^b: an S-curve, so only likely near-duplicates are compared."
  - q: "What is train-test contamination, and how is it detected?"
    a: "Evaluation text present in the training data; it is found by n-gram overlap, such as shared 13-word sequences, and removed or reported separately."
  - q: "How is a data loader made exactly resumable?"
    a: "Derive every shuffle from the seed and epoch so the state is a position, and save any stateful part, such as a shuffle buffer and its generator, in the checkpoint."
  - q: "How many epochs does a domain get under mixture weights?"
    a: "A domain sampled with weight p in a run of T tokens is repeated p T / size times."
  - q: "What is the risk of filtering with a quality classifier?"
    a: "It learns what its reference text looks like, so it can remove good text in other styles or dialects and narrow the training distribution."
katas: [e02, e03, e09]
