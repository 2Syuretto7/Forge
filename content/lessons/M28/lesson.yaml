annotations:
  - {target: M18, anchor: "The Hessian and second-order Taylor", text: "M28: a function is convex exactly when this Hessian is positive semidefinite everywhere, and the ratio of its largest to smallest eigenvalue, the condition number, sets how slowly gradient descent converges."}
  - {target: M13, anchor: "Quadratic forms and positive definiteness", text: "M28: a positive definite quadratic form is a strongly convex function; the elongation of its elliptical level sets is the square root of its condition number."}
concepts:
  - q: "Why does a convex function have no bad local minima?"
    a: "If x were a local minimum and some y had f(y) < f(x), then along the segment from x to y convexity gives f(x + t(y - x)) <= (1 - t) f(x) + t f(y) < f(x) for every small t > 0, so points arbitrarily close to x would be lower, contradicting local minimality. For differentiable convex f, the tangent-plane inequality f(y) >= f(x) + grad f(x)^T (y - x) says the same: a zero gradient means no point is lower."
