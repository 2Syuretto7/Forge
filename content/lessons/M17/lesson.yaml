capstone: "Adaptive quadrature library hitting 1e-8 on 20 integrals, including the Gaussian and a Beta normalizer, with evaluation counts reported"
teaser: "Riemann sums, the definite integral, the fundamental theorem of calculus with proof, substitution and integration by parts, improper integrals, the Gaussian integral, and quadrature from trapezoids to adaptive Simpson."
