hooks:
  - {to: M20, text: "Integrals over the plane and space, and the Jacobian factor that changing variables brings."}
  - {to: M22, text: "Expectations and variances of continuous random variables are integrals against a density."}
  - {to: M24, text: "Monte Carlo replaces a grid of points by random samples, and its error does not grow with the dimension."}
reuses:
