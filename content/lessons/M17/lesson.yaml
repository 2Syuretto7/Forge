annotations:
  - {target: M15, anchor: "the slopes of the stages multiply", text: "M17: read backwards, the chain rule is integration by substitution, and the product rule is integration by parts."}
  - {target: M05, anchor: "an infinite sum is defined as the limit of its partial sums", text: "M17: an improper integral is defined the same way, as a limit of integrals over growing intervals; the integral test compares the two, which is why 1/k and 1/x both diverge."}
concepts:
  - q: "State the fundamental theorem of calculus and say why it is true."
    a: "If f is continuous and F(x) is the integral of f from a to x, then F'(x) = f(x); so the integral from a to b equals G(b) - G(a) for any antiderivative G. The reason: adding a thin strip from x to x + h adds about f(x) h of area, so the area grows at rate f(x)."
katas: [e02]
