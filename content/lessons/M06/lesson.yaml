id: M06
hours: 10
capstone: "Growth-law detector: given 6 datasets, classify each as linear, exponential or power law from log and log-log fits, and estimate its parameters"
teaser: "Powers, the number e, the exponential and its inverse the logarithm, log scales, and the functions built from them: sigmoid, softmax and log-sum-exp."
movements:
  - {file: m0-recall.md,     mode: theory,   minutes: 25}
  - {file: m1-puzzle.md,     mode: theory,   minutes: 40}
  - {file: m2-derivation.md, mode: theory,   minutes: 170}
  - {file: m3-build.md,      mode: practice, minutes: 150}
  - {file: m4-scale.md,      mode: practice, minutes: 60}
  - {file: m5-break.md,      mode: both,     minutes: 60}
  - {file: m6-feynman.md,    mode: theory,   minutes: 35}
  - {file: m7-capstone.md,   mode: practice, minutes: 60}
hooks:
  - {to: M07, text: "e to the i theta joins growth and rotation: the exponential of an imaginary number turns instead of grows."}
  - {to: M15, text: "The exponential is the function that is its own derivative, and the logarithm's derivative is 1/x."}
  - {to: M26, text: "Floating point stores a number as a mantissa and a power of two; the max trick of softmax becomes a lesson in numerical stability."}
  - {to: M27, text: "Information is measured in logarithms: surprise is minus the log of a probability, and entropy is its average."}
reuses:
  - {from: M01, concept: "scientific notation and orders of magnitude"}
  - {from: M04, concept: "inverse functions and bisection"}
  - {from: M05, concept: "limits and series"}
annotations:
  - {target: M01, anchor: "turn products into sums", text: "M06: this is the logarithm's defining rule, log(ab) = log a + log b, and it follows from the power rule b^u b^v = b^(u+v)."}
  - {target: M05, anchor: "The true growth is", text: "M06: ln n is the inverse of the exponential, and the harmonic sums track it because the slope of ln at k is 1/k."}
concepts:
  - q: "Why does a logarithm turn multiplication into addition, and why is that useful for probabilities?"
    a: "A logarithm is an exponent: log_b x is the power of b that gives x. Multiplying numbers adds their exponents, b^u b^v = b^(u+v), so the log of a product is the sum of the logs. Probabilities of independent events multiply and quickly become too small to store; their logs add instead, staying modest in size and turning products of thousands of terms into sums."
katas: [e08]
