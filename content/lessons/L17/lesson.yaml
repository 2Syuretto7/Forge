capstone: "Reinforcement learning with an exact-match reward that raises a fine-tuned model's accuracy on held-out arithmetic, with the reward-KL tradeoff reported for two penalty strengths"
teaser: "Train a language model with rewards: policy gradients and baselines, PPO, reward models from preferences, DPO, verifiable rewards, and what goes wrong when the reward is wrong."
