annotations:
  - {target: M27, movement: m2-derivation, anchor: "3. Cross-entropy and KL divergence", text: "L17 uses this divergence as the leash that keeps a policy near its reference during RLHF, and derives the optimal policy under it."}
  - {target: L03, movement: m2-derivation, anchor: "3. The backward pass of each layer", text: "L17 reuses the softmax gradient as the score function of the policy gradient."}
concepts:
  - q: "What is the policy gradient?"
    a: "The gradient of expected reward equals the expectation of reward times the gradient of the log-probability of the sampled response, so it can be estimated from samples."
  - q: "Why does a baseline not bias the policy gradient?"
    a: "The expected score function is zero, so subtracting any baseline that does not depend on the sampled response leaves the expectation unchanged while reducing variance."
  - q: "What is the optimum of reward minus beta times KL to a reference?"
    a: "The reference policy tilted by exp(reward / beta) and renormalized."
  - q: "How does DPO train on preferences without a reward model?"
    a: "It writes the reward as beta times the log-ratio of policy to reference, substitutes it into the Bradley-Terry likelihood, and maximizes that likelihood directly."
  - q: "What are group-relative advantages?"
    a: "Several responses are sampled for the same prompt and each reward is normalized by the group's mean and standard deviation, replacing a value network as the baseline."
  - q: "What is reward overoptimization?"
    a: "Optimizing a proxy reward too hard raises the proxy while true quality first rises and then falls, which a KL penalty and held-out evaluations guard against."
katas: [e01, e05, e08]
