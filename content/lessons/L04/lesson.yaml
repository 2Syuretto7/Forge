id: L04
hours: 7
capstone: "Compression experiment: Huffman code a text corpus and compare bits per character with entropy estimates"
teaser: "Surprisal, entropy, cross-entropy and KL: why training loss is measured in nats and what 1.5 nats means."
movements:
  - {file: m0-recall.md,     mode: theory,   minutes: 20}
  - {file: m1-puzzle.md,     mode: theory,   minutes: 35}
  - {file: m2-derivation.md, mode: theory,   minutes: 130}
  - {file: m3-build.md,      mode: practice, minutes: 90}
  - {file: m4-scale.md,      mode: practice, minutes: 50}
  - {file: m5-break.md,      mode: both,     minutes: 40}
