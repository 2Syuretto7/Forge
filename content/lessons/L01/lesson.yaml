concepts:
  - q: "Why does the residual of a least-squares fit end up orthogonal to every column of A?"
    a: "At the minimizer the gradient 2A^T(Ax - b) is zero, so A^T r = 0: the residual has zero dot product with each column. Geometrically, Ax is the projection of b onto the column space, and the shortest path from b to a subspace meets it at a right angle."
  - q: "How are the singular values of A related to the eigenvalues of A^T A?"
    a: "A^T A = V Sigma^2 V^T, so its eigenvalues are the squared singular values of A and its eigenvectors are the right singular vectors."
  - q: "What does a condition number of 10^8 tell you about solving Ax = b in float32?"
    a: "Relative errors in b (or rounding of about 1e-7 in float32) can be amplified by up to 10^8, so the computed x may have no correct digits at all."
  - q: "Why is solving least squares with QR more accurate than with the normal equations?"
    a: "Forming A^T A squares the condition number; QR works with A directly, so the error grows with kappa(A) rather than kappa(A)^2."
  - q: "State the Eckart-Young theorem in one sentence."
    a: "Truncating the SVD to the top k singular triplets gives the best rank-k approximation in Frobenius (and spectral) norm, with squared Frobenius error equal to the sum of the discarded squared singular values."
katas: [e03, e07, e12]
