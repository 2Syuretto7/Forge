annotations:
  - {target: L07, movement: m2-derivation, anchor: "4. Backpropagation", text: "L08 automates exactly this: each operation records its inputs and a VJP on a tape, and backward() replays the tape in reverse."}
concepts:
  - q: "Why must an autograd engine visit nodes in reverse topological order during backward?"
    a: "A node's gradient is complete only after every node that uses it has passed its contribution back; reverse topological order guarantees all consumers are processed first."
  - q: "How do you compute the gradient of an input that was broadcast in the forward pass?"
    a: "Sum the output gradient over every dimension that was added or stretched from size 1, so the gradient has the input's original shape."
  - q: "Why do frameworks complain about in-place modification of tensors needed for backward?"
    a: "The backward pass reads tensors saved during the forward pass; changing them in place makes the gradient use wrong values silently, so frameworks track a version counter and raise an error."
  - q: "What does torch.no_grad() do?"
    a: "It stops the recording of operations, so no graph is built and no tensors are saved for backward, saving memory during inference."
  - q: "Why do gradients accumulate rather than overwrite?"
    a: "A tensor used several times receives one contribution per use, and the chain rule sums them; that is also why optimizers must zero gradients between steps."
katas: [e02, e04, e06]
