annotations:
  - {target: L11, movement: m2-derivation, anchor: "7. When data runs out, and when it is not all equal", text: "L20 sizes its model on a corpus of a million bytes, where data runs out long before compute, and trains a larger model for many epochs."}
concepts:
  - q: "When does the Chinchilla ratio of about 20 tokens per parameter not apply?"
    a: "When data, not compute, is the limit: with a small corpus a larger model trained for many epochs with regularization and validation-based stopping does better."
  - q: "What does a design document contain?"
    a: "Each decision with the main alternative, the evidence for the choice (a measurement, a calculation or a reference), and the result that would change it."
  - q: "Why fix evaluation sets before training?"
    a: "So that no training stage can see them; any overlap inflates scores exactly where it occurs."
  - q: "What is train/serve skew?"
    a: "Any difference between how inputs are processed in training and in serving, such as a different tokenizer or text normalization, which silently degrades the served model."
  - q: "Why keep a manifest of digests?"
    a: "So every reported number can be traced to the exact data and configuration that produced it, and a stale input is detected."
katas: [e04, e06, e09]
