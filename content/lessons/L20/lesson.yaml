concepts:
  - q: "Why is the prompt masked out of the fine-tuning loss?"
    a: "The model's job is the response; training on prompt tokens spends the gradient on reproducing inputs and teaches the model to generate prompts."
  - q: "What does LoRA train?"
    a: "A low-rank update (alpha / r) B A added to each frozen weight, with B starting at zero; it trains r (d_in + d_out) parameters per matrix and can be merged into the weight afterwards."
  - q: "Why is a low-rank update usually enough for fine-tuning?"
    a: "Fine-tuning updates have quickly decaying singular values, so by Eckart-Young a truncated SVD of low rank captures most of the update."
  - q: "What is catastrophic forgetting, and how is it limited?"
    a: "The loss on the pretraining distribution rises as fine-tuning moves the weights; small learning rates, replaying pretraining data, a penalty toward the pretrained weights and training fewer parameters limit it."
  - q: "Why does distillation use a temperature, and why the T squared factor?"
    a: "Softening both distributions exposes the teacher's small probabilities on wrong answers; the gradient of the softened KL scales as 1/T, so T squared keeps its size independent of T."
  - q: "How do you pack several examples into one sequence correctly?"
    a: "Use an attention mask that only lets positions attend within their own example, and restart the position ids at each example."
katas: [e01, e03, e07]
