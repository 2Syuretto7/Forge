id: L20
hours: 12
capstone: "One notebook that cleans a crawl, pretrains a byte-level GPT, fine-tunes it with LoRA, improves it with RL on an exact-match reward, evaluates every stage with intervals and serves it, with a manifest and a final report"
teaser: "Put it all together: a design document that defends every choice, then one pipeline from a raw crawl to a served model, measured at every stage."
