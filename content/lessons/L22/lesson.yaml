id: L22
hours: 10
capstone: "A continuous-batching inference server with a key-value cache and int8 weights that serves a workload of arriving requests within stated latency and throughput targets on a T4"
teaser: "Serve a language model fast: why decoding is memory-bound, the key-value cache, continuous batching and paged memory, weight quantization, and speculative decoding that leaves the output distribution unchanged."
