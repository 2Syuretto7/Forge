annotations:
  - {target: L13, movement: m2-derivation, anchor: "3. The causal mask", text: "L22 exploits the causal mask: earlier keys and values never change, so a generator caches them and computes only the new token."}
  - {target: L17, movement: m2-derivation, anchor: "1. IEEE formats", text: "L22 stores weights as 8-bit integers with a scale per row, halving the bytes every decode step reads."}
concepts:
  - q: "Why is decoding memory-bound?"
    a: "Each decode step reads every weight once but does only about two operations per weight per sequence, an arithmetic intensity far below the GPU's ridge point unless many sequences share the step."
  - q: "How large is the key-value cache per token?"
    a: "Two times the number of layers times the number of key-value heads times the head dimension times the bytes per number."
  - q: "What does continuous batching change?"
    a: "It schedules at every decode step, so finished sequences leave at once and waiting requests take their slots instead of waiting for the whole batch to finish."
  - q: "What does paged attention fix?"
    a: "It allocates each sequence's cache in fixed-size pages as it grows, so memory is not reserved for tokens never generated and shared prefixes can share pages."
  - q: "Why does weight-only quantization speed up decoding?"
    a: "Decode time is mostly spent reading weights, so storing them in 8 or 4 bits cuts the bytes per step almost proportionally, if a kernel dequantizes as it loads."
  - q: "Why does speculative decoding preserve the output distribution?"
    a: "Each draft token is accepted with probability min(1, p/q) and a rejection resamples from the normalized residual max(0, p - q), which together give exactly p."
katas: [e02, e03, e09]
