concepts:
  - q: "What must a checkpoint contain for an exact resume?"
    a: "The model and optimizer states (including Adam's step), the gradient scaler, the step and the data position, the random-number states that dropout and shuffling use, and the configuration."
  - q: "What is the z-loss?"
    a: "A small penalty on the square of log Z, the log-sum-exp of the output logits, which keeps the logits from drifting to large values where low-precision arithmetic fails; PaLM used a weight of 1e-4."
  - q: "Why can Adam take a huge step after a quiet period?"
    a: "When a parameter's gradients have been near zero, its second-moment estimate decays, so a sudden gradient is divided by a tiny square root and the update can be several times larger than usual; a lower beta2 shortens that memory."
  - q: "How do large runs recover from a loss spike?"
    a: "Restart from a checkpoint before the spike and skip the data batches around it, possibly with a lower learning rate."
  - q: "How often should a run checkpoint?"
    a: "About every sqrt(2 C M), where C is the time to write a checkpoint and M the mean time between failures (Young and Daly), balancing checkpoint cost against lost work."
  - q: "Why does QK-layernorm prevent attention logit growth?"
    a: "Normalized queries and keys have bounded norms, so their scaled dot products are bounded by about the square root of the head dimension times the gains."
katas: [e01, e04, e06]
