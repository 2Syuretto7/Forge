id: L23
hours: 10
capstone: "Train a small attention-only model, locate the induction circuit by attention scores and activation patching, and validate it with ablations against random baselines and a prediction on new inputs"
teaser: "Measure a model honestly and look inside it: confidence intervals over items, linear probes and their controls, superposition, sparse autoencoders, and activation patching to find circuits."
