concepts:
  - q: "Why does a forward-difference derivative estimate get worse when the step size is extremely small?"
    a: "Rounding error in f(x+h) - f(x) is about eps*|f(x)|, and dividing by h amplifies it to eps*|f|/h. Below h near sqrt(eps) this rounding term dominates the truncation error h*|f''|/2."
  - q: "What is a vector-Jacobian product, and why is it what backpropagation computes?"
    a: "For f with Jacobian J and a row vector u, the VJP is u^T J. With a scalar loss L, the gradient with respect to a layer's input is the upstream gradient (dL/dy)^T times that layer's Jacobian, so each layer only needs to compute a VJP, never its full Jacobian."
  - q: "When is forward mode cheaper than reverse mode?"
    a: "When the function has fewer inputs than outputs. Forward mode needs one pass per input direction, reverse mode one pass per output; a scalar loss of many parameters makes reverse mode far cheaper."
  - q: "What is the Jacobian of the softmax?"
    a: "diag(p) - p p^T, where p is the softmax output. Its rows and columns sum to zero because shifting all logits equally does not change p."
  - q: "Why does a small gradient step decrease a smooth function?"
    a: "By Taylor's theorem f(x - eta g) = f(x) - eta |g|^2 + O(eta^2). For small enough eta the first-order decrease dominates; if the curvature is at most L, any eta below 2/L guarantees a decrease."
katas: [e05, e07, e09]
