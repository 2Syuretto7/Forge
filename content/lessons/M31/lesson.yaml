id: M31
hours: 12
capstone: "Evaluation report with Hoeffding and bootstrap intervals and a demonstration of test-set reuse inflating accuracy by a measured amount"
teaser: "Hoeffding's inequality and Chernoff's bound, the union bound and finite-class generalization, growth functions and the VC dimension, Rademacher complexity, the bias-variance decomposition, and what test-set reuse does to all of them."
movements:
  - {file: m0-recall.md,     mode: theory,   minutes: 25}
  - {file: m1-puzzle.md,     mode: theory,   minutes: 40}
  - {file: m2-derivation.md, mode: theory,   minutes: 215}
  - {file: m3-build.md,      mode: practice, minutes: 175}
  - {file: m4-scale.md,      mode: practice, minutes: 75}
  - {file: m5-break.md,      mode: both,     minutes: 70}
