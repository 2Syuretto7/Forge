id: M36
hours: 12
capstone: "Policy-gradient agent solving a gridworld, with variance of the gradient reduced by a measured factor using a learned baseline"
teaser: "The log-derivative trick and REINFORCE, baselines and variance reduction, the reparameterization trick and Gumbel-softmax, Markov decision processes and Bellman equations, the policy gradient theorem, and what goes wrong when the reward is only a proxy."
movements:
  - {file: m0-recall.md,     mode: theory,   minutes: 25}
  - {file: m1-puzzle.md,     mode: theory,   minutes: 40}
  - {file: m2-derivation.md, mode: theory,   minutes: 215}
  - {file: m3-build.md,      mode: practice, minutes: 175}
  - {file: m4-scale.md,      mode: practice, minutes: 75}
