capstone: "Sampler toolkit: 5 transforms from uniform noise to target densities, each verified by histogram and by the change-of-variables formula"
teaser: "Double and triple integrals, Fubini, change of variables with the Jacobian determinant, polar and spherical coordinates, Gaussian normalizers in n dimensions, and how densities transform under maps."
