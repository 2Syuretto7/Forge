id: L07
hours: 9
capstone: "A profiling report that explains a provided slow training step and a rewrite that runs it at least twice as fast on a T4 with the same losses"
teaser: "How a GPU executes your tensor operations, why most of them are limited by memory rather than arithmetic, and how to measure the difference."
